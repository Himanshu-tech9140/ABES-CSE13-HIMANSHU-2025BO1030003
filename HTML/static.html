<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .container {
    display: grid;
    grid-template-columns: 200px repeat(2, 1fr 2fr) 200px; 
}
        .container > div{
            border: 2px solid black;
            text-align: center;
            padding: 10px;
            background-color: aquamarine;
            align-content: center;
        }
    </style>
</head>
<body>
    <center><h2>Display the Fruits Name in Grid Format</h2></center>
    <div class="container">
  <div class="item">Apple</div>
  <div class="item">Banana</div>
  <div class="item">Mango</div>
  <div class="item">Guava</div>
  <div class="item">Berries</div>
  <div class="item">Papaya</div>
  <div class="item">Litchi</div>
  <div class="item">Grapes</div>
</div>
</body>
</html>
